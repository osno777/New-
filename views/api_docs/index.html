<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>{{ h1 }}</h1>
    <span class="badge bg-secondary">Данные загружаются через JavaScript (Fetch API)</span>
</div>

<div id="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Загрузка статей...</p>
</div>

<div id="error" class="alert alert-danger" style="display: none;"></div>

<div class="row g-4" id="articles-container">
    <!-- Сюда JS будет вставлять карточки -->
</div>

<style>
    .api-card {
        border-radius: 12px;
        overflow: hidden;
        transition: transform 0.2s, box-shadow 0.2s;
        height: 100%;
    }
    .api-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
    }
    .api-card-img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }
    .api-card-no-img {
        width: 100%;
        height: 200px;
        background-color: #e9ecef;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6c757d;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById('articles-container');
        const loading = document.getElementById('loading');
        const errorBlock = document.getElementById('error');

        // Запрос к нашему JSON API
        fetch('/api/articles')
            .then(response => {
                if (!response.ok) throw new Error('Ошибка сети');
                return response.json();
            })
            .then(data => {
                loading.style.display = 'none';
                const articles = data.articles;

                if (!articles || articles.length === 0) {
                    container.innerHTML = '<div class="col-12"><p class="text-muted">Статей пока нет.</p></div>';
                    return;
                }

                articles.forEach(article => {
                    let imgPath = article.img ? '/' + article.img : null;
                    
                    const imgHtml = imgPath 
                        ? `<img src="${imgPath}" class="api-card-img" alt="${article.name}">`
                        : `<div class="api-card-no-img">Нет изображения</div>`;

                    const cardHtml = `
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="card api-card shadow-sm border-0">
                                ${imgHtml}
                                <div class="card-body d-flex flex-column p-4">
                                    <h3 class="card-title fw-bold mb-3" style="font-size: 1.25rem;">${article.name}</h3>
                                    <p class="card-text text-secondary flex-grow-1" style="font-size: 0.95rem;">${article.text}</p>
                                    <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                                        <small class="text-muted">ID автора: <strong>${article.author_id}</strong></small>
                                        <a href="/article/${article.id}" class="btn btn-outline-secondary btn-sm">Читать</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHtml);
                });
            })
            .catch(err => {
                loading.style.display = 'none';
                errorBlock.style.display = 'block';
                errorBlock.innerText = 'Не удалось загрузить статьи: ' + err.message;
            });
    });
</script>
