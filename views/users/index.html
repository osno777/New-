<div class="card p-4 shadow-sm">
    <h1>{{ h1 }}</h1>
    <hr>
    <table class="table table-striped table-hover mt-3">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Никнейм</th>
                <th>Email</th>
                <th>Роль</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u.get_id() }}</td>
                <td>{{ u.get_nickname() }}</td>
                <td>{{ u.get_email() }}</td>
                <td>{{ u.get_role() }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
